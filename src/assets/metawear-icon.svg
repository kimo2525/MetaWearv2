<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60" fill="none">
  <defs>
    <linearGradient id="blue" x1="8" y1="8" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2F80FF"/>
      <stop offset="1" stop-color="#0057E7"/>
    </linearGradient>
    <linearGradient id="silver" x1="17" y1="16" x2="43" y2="44" gradientUnits="userSpaceOnUse">
